[project]
name = "agentic-core"
version = "0.1.0"
description = "Core library: definitions, policy, engine, agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.13.1,<2.14",
    "opentelemetry-api>=1.45,<2",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "truststore>=0.10,<0.11",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic"
