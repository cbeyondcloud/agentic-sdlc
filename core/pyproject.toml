[project]
name = "agentic-core"
version = "0.1.0"
description = "Core library: definitions, policy, engine, agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic"
