# feature-delivery: a request becomes a reviewed, tested pull request (spec §6.2).
# BA -> [requirements gate] -> test baseline -> Design -> [design gate] -> Developer
# <-> Code Review <-> QA -> [review gate] -> pull request. Every step's agent is a
# library agent (library/agents/); the stage instructions come from Zyroflo's SOPs.
# A QA `fail` routes the work back to the Developer, with the QA report among its
# inputs (DF-238): the build loop ends only on a clean review and a QA pass. Still
# failing after 3 rounds, the run waits at the loop's gate, where a bare approval is
# refused: a person edits a handoff (marks a review finding accepted, or names a failing
# test in the QA report's accepted_failures - an attributable acceptance), rejects with
# feedback for another round, or stops the run.
name: feature-delivery
version: 1.0.0
regime: team
inputs:
  request: { from: [text, file, jira] }

steps:
  - id: requirements                    # questions, options, EARS acceptance criteria
    agent: business-analyst

  - gate: requirements-approval         # a person answers the BA's Open Questions (spec §5.4);
    approver_role: team-lead            # rejecting with the answers re-runs the BA on them

  - id: baseline                       # the tests on the untouched tree: QA's "no new failures" bar
    agent: qa-baseline

  - id: design                          # change set, test plan, decisions, impact
    agent: design

  - gate: design-approval               # nothing is built before a person approves the design
    approver_role: team-lead

  - loop:
      id: build-review
      max_iterations: 3
      # Zyroflo's exit rule (the score never gates), and QA's verdict: a fail loops back
      until: "review.open_blocking == 0 && test_report.verdict == 'pass'"
      on_exhausted: gate                   # still failing after 3 rounds: a person decides
      steps:
        - id: develop
          agent: developer
        - id: review
          agent: code-review
        - id: qa                           # tests against the baseline, every acceptance
          agent: qa                        # criterion - every round, so the loop always
                                           # ends on a QA report about the current change

  - gate: review-approval               # a person reads the change and its QA report
    approver_role: approver

  - id: publish
    action: github.open_pr
    when: "test_report.verdict == 'pass'"   # always true after the loop; kept as a guard
