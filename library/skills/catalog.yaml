# The default skills catalog (spec §11.2-11.4, master plan "Skills init downloads").
# Each skill is vendored at a pinned upstream commit, adapted to remove harness-specific
# orchestration, and pinned here by content hash (agentic.skills.skill_digest). An org
# copies this folder into its policy repo's skills/ and owns it from there.
# Licences and changes: THIRD_PARTY_NOTICES.md.
#
# Pre-loading for weaker or local models (spec §11.1) is off until an org names them,
# e.g.  preload_for: {tiers: [fast], models: ["local/*"]}

excluded:
  using-superpowers: always-invoke bootstrap; duplicates the orchestrator and conflicts with role prompts (spec 11.4)
  subagent-driven-development: duplicates the orchestrator (spec 11.4)
  executing-plans: duplicates the orchestrator (spec 11.4)
  using-git-worktrees: worktree and branch workflow belong to the engine (spec 11.4)
  finishing-a-development-branch: worktree and branch workflow belong to the engine (spec 11.4)
  caveman: no total-cost saving, accuracy collapse on small models, telemetry (spec 11.4)
  docx: anthropics/skills document skills are source-available, not open source
  pdf: anthropics/skills document skills are source-available, not open source
  pptx: anthropics/skills document skills are source-available, not open source
  xlsx: anthropics/skills document skills are source-available, not open source

