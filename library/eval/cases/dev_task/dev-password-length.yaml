id: dev-password-length
agent: developer
case_class: dev_task
split: dev
source: {repo: synthetic, synthetic: true, licence: CC0-1.0}
inputs:
  prompt: |
    The password policy measures length in UTF-8 bytes, so a 6-character password
    with accented letters passes the 8-character minimum. Count characters. Make the failing tests pass without breaking the others.
  workspace: workspaces/dev-password-length
expected:
  tests:
    fail_to_pass:
      - "tests/test_policy.py::test_characters_not_bytes"
    pass_to_pass:
      - "tests/test_policy.py::test_ascii_passwords"
  solution: solutions/dev-password-length
tags: [python, security]
