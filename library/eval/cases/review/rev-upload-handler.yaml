id: rev-upload-handler
agent: code-review
case_class: review
split: holdout
source: {repo: synthetic, synthetic: true, licence: CC0-1.0}
inputs:
  prompt: "Review this change to the attachment upload handler."
  diff: |
    diff --git a/internal/attach/upload.go b/internal/attach/upload.go
    --- a/internal/attach/upload.go
    +++ b/internal/attach/upload.go
    @@ -21,15 +21,17 @@ func (h *Handler) Upload(w http.ResponseWriter, r *http.Request) {
    -	file, _, err := r.FormFile("file")
    +	r.ParseMultipartForm(32 << 20)
    +	file, header, err := r.FormFile("file")
     	if err != nil {
     		http.Error(w, "missing file", http.StatusBadRequest)
     		return
     	}
    -	dst, err := os.CreateTemp(h.dir, "upload-*")
    +	dst, err := os.Create(filepath.Join(h.dir, header.Filename))
     	if err != nil {
     		http.Error(w, "cannot store file", http.StatusInternalServerError)
     		return
     	}
    -	defer dst.Close()
    -	if _, err := io.Copy(dst, file); err != nil {
    +	io.Copy(dst, file)
    +	dst.Close()
    +	if err := h.index.Add(dst.Name()); err != nil {
     		http.Error(w, "cannot store file", http.StatusInternalServerError)
     		return
     	}
expected:
  seeded_defects:
    - file: internal/attach/upload.go
      lines: [27, 27]
      category: security
      note: "the client's file name is joined into the path: '../' or an absolute name writes outside the upload folder, and two uploads with one name overwrite"
    - file: internal/attach/upload.go
      lines: [32, 32]
      category: error-handling
      note: "the io.Copy error is ignored: a truncated upload is indexed as complete"
    - file: internal/attach/upload.go
      lines: [21, 21]
      category: error-handling
      note: "ParseMultipartForm's error is dropped; an oversized body fails later with a misleading 'missing file'"
tags: [go, security]
