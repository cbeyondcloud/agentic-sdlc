id: rev-due-date
agent: code-review
case_class: review
split: dev
source: {repo: synthetic, synthetic: true, licence: CC0-1.0}
inputs:
  prompt: "Review this change to the due-date badge."
  diff: |
    diff --git a/web/src/dueDate.ts b/web/src/dueDate.ts
    --- a/web/src/dueDate.ts
    +++ b/web/src/dueDate.ts
    @@ -1,3 +1,4 @@
    -export function isOverdue(due: Date, now: Date): boolean {
    -  return due.getTime() < now.getTime();
    +export function isOverdue(dueIso: string, now: Date): boolean {
    +  const due = new Date(dueIso);
    +  return due == now || due < now;
     }
expected:
  seeded_defects:
    - file: web/src/dueDate.ts
      lines: [2, 2]
      category: logic
      note: "new Date('2026-03-04') is UTC midnight: users west of UTC see tasks overdue the evening before"
    - file: web/src/dueDate.ts
      lines: [3, 3]
      category: logic
      note: "== compares Date objects by identity, never by time, and makes 'due now' overdue in intent only"
tags: [typescript]
