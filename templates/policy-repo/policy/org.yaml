# Settings for the whole organisation.

# The repositories agents may work on, as host/owner/name globs. EDIT: your git host
# and organisation. A repo outside every pattern is refused by `agentic init`.
allowed_repo_patterns: ["git.example.com/your-org/*"]

# D33: pipelines come only from this repo (pipelines/ and teams/<team>/pipelines/),
# changed by pull requests the code owners approve. Repo-level pipelines are ignored.
allow_repo_pipelines: false

# Org-required steps, gates and loops per pipeline (spec §6.1): a team's overlay
# (teams/<team>/pipelines/overlays/<repo>.yaml) can never remove them, remove the step a
# required gate approves, or change a required gate's approver, and a run whose pipeline
# lacks one is refused. List the work as well as the gates: the build loop's developer,
# code review and QA, so no overlay ships a change nobody built, reviewed or tested.
required_steps:
  feature-delivery:
    [requirements-approval, design-approval, build-review, develop, review, qa, review-approval]
  bugfix: [intake-approval, fix-review, develop, review, qa, review-approval]

# Where `agentic init` fetches pinned tools from (tool-pins.yaml); an internal mirror.
# tool_mirror_url: https://artifacts.example.com/agentic-tools/

# The lowest CLI version that may register runs with the control plane.
# min_cli_version: "1.0.0"

# OS sandbox for agent commands (D38). Runs in these regimes refuse to start without
# one; the library pipelines run in the `team` regime. On Windows the sandbox needs
# WSL2 (`agentic init` says what to install).
sandbox:
  required_for: [team, regulated]
  allowed_domains:                      # package registries a sandboxed command may reach
    - pypi.org                          # EDIT: your internal mirrors instead, if any
    - files.pythonhosted.org
    - registry.npmjs.org
    - repo.maven.apache.org
  allow_write: []                       # writable besides the run's tree, e.g. "~/.cache/uv"
  # environment variables agent commands keep although their name looks secret, e.g. an
  # authenticated proxy or the SSH agent socket (never AGENTIC_*)
  pass_env: []
  # What one agent command may use (M3-10). Enforced on Linux and macOS; on native Windows
  # best effort (no file-size limit). Leave a limit out for none. EDIT to fit your builds.
  limits:
    cpu_seconds: 3600                   # CPU time per process
    memory_mb: 8192                     # resident memory of the whole command
    max_file_mb: 4096                   # the largest file a command may write
    processes: 512                      # processes a command may run at once

# A secret found in content about to leave for a model: refuse the call (block) or
# replace the secret with a marker (mask). Either way it is recorded.
secret_scan:
  action: block

# What is published (pull request bodies, tracker comments) is scanned too: personal
# data is masked by default.
publish_scan:
  action: mask

# When a backend cannot honour a resolved setting: ignore | warn | block.
unhonoured: { temperature: warn, effort: warn }

# The diff-size budget per review batch (a Developer step whose change is larger is
# asked to split it). 40 files and 1500 lines are the ceiling; a limit may only tighten.
review_batch:
  max_files: 40
  max_lines: 1500

# The deterministic review pre-pass before a reviewing agent sees a change: secrets,
# blocked licences, new ignore rules, and gitleaks, ast-grep and osv-scanner when
# tool-pins.yaml pins them. osv-scanner stays offline unless the online lookup is on,
# which sends the change's dependency list to the OSV service.
review_prepass:
  enabled: true
  agent_types: [code-review]
  online_vulnerability_lookup: false

# Untracked paths a step's checkpoint leaves out of the run branch, on top of the
# framework's own (bytecode, tool caches, coverage data); each path left out is logged.
# It only adds: git globs relative to the repository.
# checkpoint_exclude: ["**/target/**", "**/build/**", "**/.gradle/**"]

# The commit-command override: a repository whose raw git is unsafe (Zyroflo
# `vcs.deny_raw_git`) checkpoints, rolls back and publishes through its own tool
# (`vcs.commit_command` / `vcs.push_command` in .sdlc/profile.yml, `rollback_commands` in
# .agentic/config.yaml). Those commands run outside the agent sandbox, so nothing runs
# unless it starts with one of these word prefixes. Empty = no override anywhere.
# List the narrowest command, flags included: the tool may still read files an agent can
# write (its settings, scripts it calls), so the repository should protect those too.
# commit_override: { allow: ["monotool commit", "monotool restore", "monotool push"] }

# The learning loop (spec 24): this many similar human corrections of one agent, within
# this many days, become a proposal a person approves or rejects; nothing changes an
# agent without that approval. A team may only tighten (a higher threshold, fewer days).
# learning: { threshold: 3, window_days: 30, similarity: 0.5 }
