# The policy-repo gate: every pull request must load, and every catalogued skill must be
# admitted, under the org's own licences and limits (agentic policy check). Make this
# check required in the branch protection of the default branch.
name: policy-check
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # EDIT: install from your internal package index, at the org's pinned version
      - run: uv tool install "agentic[skills]"
      - run: agentic policy check .
