# An overlay (spec §6, D33): team payments' changes to org pipelines for ONE repository,
# the one whose name is this file's name (payments-api, in any letter case). Only this
# team's leads and the org admins change it (CODEOWNERS). EDIT or delete this example.
#
# An overlay may remove steps, gates and loops that are not org-required, add steps,
# turn four_eyes on, set a gate's on_reject or (not for an org-required gate) its
# approver_role, tighten the regime and lower max_minutes. It can never remove or weaken
# an org-required step or gate (policy/org.yaml required_steps): the policy check and
# every laptop refuse it, naming the rule. When a removed step had a gate after it, the
# gate re-anchors to the previous remaining step, and the run's plan says so.

# repo: git.example.com/your-org/payments-api   # bind to exactly one repository
pipelines:
  feature-delivery:
    gates:
      review-approval: {four_eyes: true}        # a second person signs off every change
    max_minutes: 240
