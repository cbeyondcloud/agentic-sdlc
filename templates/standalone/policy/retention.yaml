# How long local records are kept, in days (M3-06; open requirement OR-01, owner decision
# 115). Standalone use has no control plane: `run_folders` is the age at which `agentic gc`
# prunes a finished run's folder and worktrees; the other kinds apply in org mode.
days:
  audit: 2555
  runs: 400
  gateway_usage: 400
  traces: 30
  feedback: 365
  run_folders: 30
  logs: 30
  backups: 35
