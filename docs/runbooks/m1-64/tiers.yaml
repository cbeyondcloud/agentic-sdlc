# M1-64 quality-gate run (owner decisions 63-64): every tier through the owner's local
# TokenLean LITE and one OpenRouter key (LLM_KEY_OPENROUTER). TokenLean names OpenRouter
# models "openrouter/<vendor>/<model>". The framework reads a model id as
# "<route>/<name-sent-to-TokenLean>" (agentic.agents.models: `anthropic/` = TokenLean's
# Messages route, anything else = its OpenAI-compatible route), so `tokenlean/` selects the
# OpenAI-compatible route and the rest is TokenLean's own name (M1-64 pilot finding).
# `family:` is set explicitly because the shared prefix would otherwise make every model
# look like one family (S10/D41: the judge must come from a different family).
tiers:
  deep-reasoning: { model: tokenlean/openrouter/anthropic/claude-opus-5.5, effort: high, family: anthropic }
  balanced: { model: tokenlean/openrouter/anthropic/claude-sonnet-5.5, effort: medium, family: anthropic }
  fast: { model: tokenlean/openrouter/anthropic/claude-haiku-5.5, effort: low, family: anthropic }
  local: { model: local/change-me }
  eval-judge: { model: tokenlean/openrouter/openai/gpt-6.1-sol, family: openai }
