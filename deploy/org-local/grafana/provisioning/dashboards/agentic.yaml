# Dashboard providers for the local org stack (M2-38). Grafana reads JSON files only; no
# Grafana code is shipped or changed (ruling G1: the official image runs unmodified).
#
#   agentic  the eight framework dashboards (Executive ROI among them, M3-01), generated
#            from agentic_cp.dashboards.catalog
#            (control-plane/src/agentic_cp/dashboards/grafana, mounted read-only)
#   gateway  the gateway's LITE dashboard set (spec 25), mounted read-only from TOKENLEAN_DIR
apiVersion: 1

providers:
  - name: agentic
    orgId: 1
    folder: Agentic
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/agentic
      foldersFromFilesStructure: false
  - name: gateway
    orgId: 1
    folder: Gateway
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/gateway
      foldersFromFilesStructure: false
