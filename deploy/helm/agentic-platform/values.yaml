# Values for the agentic-platform chart (M3-02). Every value is documented here; the
# chart's README explains the prerequisites (a Postgres, the Secret, the image).
#
# No value in this file takes a secret. Secrets live in one Kubernetes Secret you create
# (by hand, External Secrets or Sealed Secrets), named by secrets.existingSecret.

environment:
  # -- dev, staging or prod (M3-04; environments/<name>.yaml sets it); empty: a single
  # install without promotion. prod refuses to render without ingress TLS, a managed
  # Secret (externalSecrets or secrets.externallyManaged) and an image digest.
  name: ""
  # -- The policy repo branch this environment tracks (AGENTIC_CP_POLICY_BRANCH); every
  # tenant follows it. Empty: from the name (dev -> dev, staging -> staging, prod -> main);
  # no name, no pin (each tenant picks its own branch).
  policyBranch: ""

# -- Override the chart name in object names.
nameOverride: ""
# -- Override the full object name prefix (default: <release>-agentic-platform, or the
# release name when it already contains the chart name).
fullnameOverride: ""

image:
  # -- The control-plane image, built from control-plane/Dockerfile and pushed to your
  # registry (`docker build -f control-plane/Dockerfile .` from the repository root).
  repository: agentic-control-plane
  # -- The image tag; empty means the chart's appVersion (the release version).
  tag: ""
  # -- An image digest (sha256:...). When set it is used instead of the tag: preferred.
  digest: ""
  pullPolicy: IfNotPresent
# -- Image pull secrets (names of existing docker-registry Secrets).
imagePullSecrets: []

secrets:
  # -- The existing Secret holding the control plane's secrets (keys below). Required. The
  # chart only references it: create it before installing (see the README).
  existingSecret: agentic-platform
  # -- Set when another tool (Sealed Secrets, a CSI secrets driver) writes that Secret
  # from a secret manager. prod needs this or externalSecrets.enabled: a Secret made by
  # hand with kubectl is not a prod secret.
  externallyManaged: false
  # -- Key names inside the existing Secret (the names, never the values).
  keys:
    # -- The runtime role's DSN (postgresql://...): API, worker and migration Job.
    databaseUrl: database-url
    # -- The owner role's DSN: the migration Job only, never the long-running pods.
    ownerDatabaseUrl: owner-database-url
    # -- Optional: the bearer token Prometheus scrapes /metrics with (16+ characters).
    metricsToken: metrics-token
    # -- Optional: the SMTP relay password.
    smtpPassword: smtp-password
    # -- Optional: TokenLean's admin API key (proxy keys, routing).
    gatewayAdminKey: gateway-admin-key
    # -- With backup.enabled: the DSN of a backup role with BYPASSRLS and pg_read_all_data
    # (the backup CronJob only). The owner role cannot dump: every tenant table forces
    # row-level security, also on its owner (docs/runbooks/postgres-backup-restore.md).
    backupDatabaseUrl: backup-database-url

externalSecrets:
  # -- Write secrets.existingSecret from your secret store with the External Secrets
  # Operator (it must be installed; BYO store: Vault, AWS, GCP, Azure...). The
  # ExternalSecret is a pre-install/pre-upgrade hook, so the migration Job finds its
  # Secret; the Secret is orphaned (it survives the hook's re-creation and an uninstall).
  enabled: false
  apiVersion: external-secrets.io/v1
  # -- The SecretStore or ClusterSecretStore to read from (required when enabled).
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  # -- Where each secrets.keys entry lives in the store: `key` (and optional `property`).
  # databaseUrl and ownerDatabaseUrl are required; a ref with an empty key is skipped.
  remoteRefs:
    databaseUrl: {key: "", property: ""}
    ownerDatabaseUrl: {key: "", property: ""}
    metricsToken: {key: "", property: ""}
    smtpPassword: {key: "", property: ""}
    gatewayAdminKey: {key: "", property: ""}
    # -- Required with backup.enabled.
    backupDatabaseUrl: {key: "", property: ""}

# -- Where people reach the control plane (invite links). Sets AGENTIC_CP_PUBLIC_URL.
publicUrl: ""
# -- The deployment's minimum CLI version (PEP 440). Raise it after a grace period
# (docs/runbooks/upgrade.md). Sets AGENTIC_CP_MIN_CLI_VERSION.
minCliVersion: ""

smtp:
  # -- The org's SMTP relay host; empty keeps mail queued (nothing is sent).
  host: ""
  port: 587
  # -- starttls, tls or none (none only for a relay inside the cluster).
  security: starttls
  # -- The relay user name (not a secret; the password is secrets.keys.smtpPassword).
  username: ""
  # -- The deployment's sender address.
  from: ""

tokenlean:
  # -- Install TokenLean's LITE sub-chart. Off by default (BYO TokenLean); the sub-chart
  # is a placeholder until the TokenLean chart is published (DF-797).
  enabled: false
  # -- The TokenLean URL developers' CLIs use (BYO). Sets AGENTIC_CP_GATEWAY_URL.
  url: ""
  # -- TokenLean's admin API (proxy keys, routing). Sets AGENTIC_CP_GATEWAY_ADMIN_URL.
  adminUrl: ""

# -- Other AGENTIC_CP_* settings by their variable name (see agentic_cp.settings), e.g.
# AGENTIC_CP_POLICY_POLL_SECONDS: "60". Settings that hold a secret are refused here.
config: {}

# -- A Secret with one `<tenant-slug>.gitconfig` per tenant (credential helper for its
# private policy and code repositories). Mounted read-only; sets AGENTIC_CP_GIT_CONFIG_DIR.
gitConfigSecret: ""

api:
  # -- Replicas when autoscaling is off (two or more for availability).
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # -- Sizing starting point (master plan): 1 vCPU / 1 GB per replica.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread replicas over nodes when the scheduler can.
  topologySpreadConstraints: []

worker:
  # -- One worker leads (a Postgres advisory lock); the others wait as standbys.
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  # -- Run `migrate` as a pre-install and pre-upgrade hook.
  enabled: true
  # -- Also create or re-align the runtime role (`db grant-runtime`). Turn off when the
  # platform team manages that role itself.
  grantRuntime: true
  # -- The Job's service account. A pre-install hook runs before the chart's own service
  # account exists, so it uses the namespace's "default" (no token is mounted).
  serviceAccountName: default
  backoffLimit: 2
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- The host name (also the TLS certificate's name).
  host: ""
  # -- The TLS Secret (for example made by cert-manager); empty: no TLS section.
  tlsSecretName: ""
  certManager:
    # -- A cert-manager Certificate for ingress.host into ingress.tlsSecretName (cert-manager
    # must be installed). Alternative: the `cert-manager.io/cluster-issuer` annotation in
    # ingress.annotations (ingress-shim).
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer

backup:
  # -- A CronJob that takes the nightly logical backup (`pg_dump -Fc --schema=<schema>` as
  # the backup role, secrets.keys.backupDatabaseUrl) into a volume, the file the restore
  # drill restores (docs/runbooks/postgres-backup-restore.md). Copy the volume to object storage with your
  # backup tool; encrypt and limit it like the database.
  enabled: false
  # -- Cron schedule (the cluster's time zone unless timeZone is set).
  schedule: "17 2 * * *"
  timeZone: ""
  # -- Days a dump is kept on the volume.
  retentionDays: 35
  # -- The pg_dump image: the same major version as your Postgres or newer, by digest.
  image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
  persistence:
    # -- An existing PersistentVolumeClaim for the dumps (required when enabled).
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

serviceAccount:
  # -- Create a service account for the pods (none of them calls the Kubernetes API).
  create: true
  name: ""
  annotations: {}

metrics:
  serviceMonitor:
    # -- A prometheus-operator ServiceMonitor scraping /metrics with the metrics token.
    enabled: false
    interval: 30s
    labels: {}
  # -- Add prometheus.io/* scrape annotations to the API pods (your scrape config must
  # send the metrics token as a bearer token).
  scrapeAnnotations: false

networkPolicy:
  # -- A NetworkPolicy for the chart's pods (your CNI must enforce policies). The release's
  # own pods (the `helm test` pod) may always reach the API.
  enabled: false
  # -- Who may reach the API (NetworkPolicy `from` peers); empty: the release namespace.
  # Required with ingress.enabled: name the ingress controller's namespace or pods.
  ingressFrom: []
  # -- Who may scrape /metrics (NetworkPolicy `from` peers, for example the monitoring
  # namespace). Required with metrics.serviceMonitor.enabled or metrics.scrapeAnnotations.
  metricsFrom: []
  # -- Set true once the platform team has checked that the cluster's CNI enforces
  # NetworkPolicy (Calico, Cilium do; kindnet and plain Flannel do not). staging and prod
  # refuse an enabled policy without it: an unenforced policy is ignored silently.
  cniEnforces: false
  # -- staging and prod without a policy: why (rendered in NOTES). Required when
  # networkPolicy.enabled is false there, for example "our CNI does not enforce NetworkPolicy".
  optOutReason: ""
  # -- Egress allow-list (NetworkPolicy `to` rules: Postgres, TokenLean, git hosts, SMTP).
  # DNS is always allowed. Empty: egress is not restricted.
  egress: []

grafana:
  dashboards:
    # -- ConfigMaps with the framework's dashboards for Grafana's dashboard sidecar.
    enabled: true
    # -- The sidecar's label (the Grafana chart's sidecar.dashboards.label).
    label: grafana_dashboard
    labelValue: "1"
    # -- The folder annotation (the Grafana chart's sidecar.dashboards.folderAnnotation).
    folderAnnotation: grafana_folder
    folder: Agentic
    # -- Grafana folder of Executive ROI (each person's cost, M3-01 review F3); limit its
    # permissions to the org viewers.
    executiveFolder: Agentic Executive
    # -- Namespace of the ConfigMaps; empty: the release namespace.
    namespace: ""
  datasource:
    # -- A ConfigMap with the dashboards' datasource (uid agentic-postgres) for Grafana's
    # datasource sidecar. Grafana reads the reader's password from its own environment.
    enabled: false
    label: grafana_datasource
    labelValue: "1"
    namespace: ""
    orgId: 1
    # -- The Postgres host:port the reader logs in to.
    host: ""
    database: agentic
    # -- The tenant's Grafana reader role (`python -m agentic_cp db dashboard-role`).
    user: ""
    # -- The variable in Grafana's environment holding the reader's password.
    passwordEnv: AGENTIC_DASH_READER_PASSWORD
    sslmode: require

# -- Pod and container security settings shared by every pod (the image's user 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
# -- Size limit of the writable /tmp (policy repository checkouts).
tmpSizeLimit: 1Gi
