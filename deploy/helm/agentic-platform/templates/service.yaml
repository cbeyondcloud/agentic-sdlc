apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic.fullname" . }}-api
  labels:
    {{- include "agentic.labels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentic.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
