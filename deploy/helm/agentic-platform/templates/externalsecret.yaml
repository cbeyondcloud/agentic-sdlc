{{- /* The chart's Secret (secrets.existingSecret) written from a secret store by the External
Secrets Operator (M3-04, optional; BYO store). A pre-install/pre-upgrade hook that runs
before the migration Job (weight -10 < -5), so the Job finds its Secret: its pod waits until
the operator has written it. The Secret is orphaned: deleting and re-creating this hook on
the next upgrade, or uninstalling, never deletes the Secret the running pods read. Only the
names of remote keys are rendered, never a value. */ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $keys := .Values.secrets.keys }}
{{- $store := required "externalSecrets.secretStoreRef.name is required: the SecretStore or ClusterSecretStore to read" $es.secretStoreRef.name }}
{{- $required := list "databaseUrl" "ownerDatabaseUrl" }}
{{- if .Values.backup.enabled }}{{ $required = append $required "backupDatabaseUrl" }}{{ end }}
{{- range $required := $required }}
{{- if not (get $es.remoteRefs $required).key }}
{{- fail (printf "externalSecrets.remoteRefs.%s.key is required: where the store keeps that DSN" $required) }}
{{- end }}
{{- end }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentic.fullname" . }}-secrets
  labels:
    {{- include "agentic.labels" (list . "secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.secretName" . }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- range $name := list "databaseUrl" "ownerDatabaseUrl" "metricsToken" "smtpPassword" "gatewayAdminKey" "backupDatabaseUrl" }}
    {{- $ref := get $es.remoteRefs $name }}
    {{- if and $ref $ref.key }}
    - secretKey: {{ get $keys $name }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
