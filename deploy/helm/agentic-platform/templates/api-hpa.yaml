{{- if .Values.api.autoscaling.enabled }}
{{- if lt (int .Values.api.autoscaling.minReplicas) 2 }}
{{- fail "api.autoscaling.minReplicas must be 2 or more (the API is highly available)" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentic.fullname" . }}-api
  labels:
    {{- include "agentic.labels" (list . "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentic.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
