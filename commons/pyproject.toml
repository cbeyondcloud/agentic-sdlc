[project]
name = "sdlc-commons"
version = "0.1.0"
description = "Shared with Zyroflo: ledger, guards, worktree, graph"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sdlc-harness==0.1.0",
    "filelock==4.2.1",  # the feedback journal lock (M3-11); core and cli pin the same
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sdlc_commons"

[tool.uv.sources]
sdlc-harness = { git = "https://github.com/cbeyondcloud/zyroflo", rev = "66cd4e56f2749c7f3bd34ff2db2109058af037a7" }
