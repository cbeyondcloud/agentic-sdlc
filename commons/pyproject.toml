[project]
name = "sdlc-commons"
version = "0.1.0"
description = "Shared with Zyroflo: ledger, guards, worktree, graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sdlc-harness",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sdlc_commons"

[tool.uv.sources]
sdlc-harness = { git = "https://github.com/cbeyondcloud/sdlc-harness", rev = "ce4ab12bd17e82d882aba07676259c5d3f0e1638" }
