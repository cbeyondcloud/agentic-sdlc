# Alembic configuration shipped with the package. Migrations run through
# `python -m agentic_cp migrate` (agentic_cp.db.migrate), which supplies the connection
# and the schema; the alembic command line is only for `alembic revision` while developing.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
