[project]
name = "agentic-control-plane"
version = "0.1.0"
description = "Org-mode control plane service"
requires-python = ">=3.12,<3.13"
# Server libraries live here only (an import contract keeps them out of core, commons and
# the CLI, so they never reach the developers' laptops through the CLI). Exact pins, each
# release at least two weeks old (SP15 plan, OSS table). Starlette is pinned because the
# newest release is younger than the release-age window.
dependencies = [
    "agentic-core",
    "sdlc-commons",
    "fastapi==0.142.4",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "greenlet==3.5.6",
    "alembic==1.20.0",
    # CODEOWNERS matching (MIT, pure Python, no dependencies; 2026-06-28), imported only by
    # agentic_cp.rbac.codeowners.
    "codeowners==0.9.0",
    # RBAC engine (owner decision row 77), imported only by agentic_cp.rbac.authz. Its
    # dependencies are pinned because their newest releases are younger than two weeks.
    "pycasbin==2.8.0",
    "simpleeval==1.0.8",
    "wcmatch==11.0.1",
    "bracex==3.0.1",
    # PEP 440 comparison of the CLI version against the minimum (M2-08); Apache-2.0 OR
    # BSD-2-Clause, pure Python, released 2026-08-04 (already in the lock transitively).
    "packaging==26.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic_cp"
# migrations/, alembic.ini and rbac/model.conf sit inside the package folder, so the
# wheel ships them as package data.
