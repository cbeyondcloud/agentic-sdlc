# Continuous integration: every push and pull request runs lint + tests
# on all three operating systems developers use.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # report every OS, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # astral publishes exact version tags only (no moving "v10" tag), so pin the release
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install workspace exactly as locked
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
