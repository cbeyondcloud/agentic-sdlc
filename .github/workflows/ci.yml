# Continuous integration: every push and pull request runs lint + tests
# on all three operating systems developers use.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # report every OS, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # pinned by commit SHA (DF-689): a moved tag cannot change what runs
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install workspace exactly as locked
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
