# Nightly agent-eval fixture mode (M1-63): replays the recorded fixture corpus through the
# real harness on all three operating systems, validates every corpus case and runs every
# dev task's tests before and after its reference change. No model is called.
name: eval-nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  eval-fixtures:
    strategy:
      fail-fast: false # report every OS, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # pinned by commit SHA (DF-689): a moved tag cannot change what runs
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install workspace exactly as locked
        run: uv sync --locked

      - name: Eval harness, corpus and fixture replay
        run: uv run pytest core/tests/eval cli/tests/test_eval_command.py
