# Runs on every `git commit` once a developer has run `uv run pre-commit install`.
# Uses the ruff already pinned in uv.lock, so the hook and CI never disagree.
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
